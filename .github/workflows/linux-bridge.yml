name: Linux bridge build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install portal sender development libraries
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libpipewire-0.3-dev
      - name: Build senders and run tests
        run: make -C linux_bridge all portal test
